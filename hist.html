<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medora | Visit History</title>

    <link rel="stylesheet" href="css/history.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <header class="header">

            <div class="brand">
                <h1>💙 Medora</h1>
                <p>AI Powered Healthcare Companion</p>
            </div>

            <a href="dashboard.html">
                <button class="dashboard-btn">
                    ← Dashboard
                </button>
            </a>

        </header>


        <!-- PAGE TITLE -->

        <section class="page-title">

            <h2>
                Visit History
            </h2>

            <p>
                All prescriptions, doctors and medicines in one place.
            </p>

        </section>


        <!-- SEARCH BAR -->

        <div class="search-box">

            <input type="text" id="searchInput" placeholder="🔍 Search Doctor, Medicine or Hospital">

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat-card">

                <h3 id="visitCount">0</h3>

                <p>Total Visits</p>

            </div>

            <div class="stat-card">

                <h3 id="doctorCount">0</h3>

                <p>Doctors</p>

            </div>

            <div class="stat-card">

                <h3 id="medicineCount">0</h3>

                <p>Medicines</p>

            </div>

        </div>


        <!-- HISTORY -->

        <div id="historyContainer" class="history-grid">

        </div>


    </div>

    <script type="module" src="js/history.js">
    </script>

</body>

</html>
